<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="SABRI WALID — Networks, Cloud and Cybersecurity">
  <defs>
    <!-- ============================================================
         1. PALETTE ET DÉGRADÉS
         ============================================================ -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#0D111A"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0.2"/>
    </linearGradient>

    <!-- ============================================================
         2. FILTRES ET EFFETS LUMINEUX
         ============================================================ -->
    <filter id="glowSubtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- ============================================================
         3. MOTIFS DE FOND
         ============================================================ -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.05"/>
    </pattern>
    
    <pattern id="dotPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00E5FF" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- ============================================================
       4. FOND ET GRILLE
       ============================================================ -->
  <rect width="1200" height="280" fill="url(#bgGrad)"/>
  <rect width="1200" height="280" fill="url(#gridPattern)"/>
  <rect width="1200" height="280" fill="url(#dotPattern)"/>

  <!-- Lignes de délimitation supérieures et inférieures -->
  <rect x="0" y="0" width="1200" height="1" fill="url(#accentGrad)"/>
  <rect x="0" y="279" width="1200" height="1" fill="url(#accentGrad)" opacity="0.3"/>

  <!-- ============================================================
       5. SYMBOLE GRAPHIQUE (PARTIE GAUCHE)
       ============================================================ -->
  <g transform="translate(40, 40)">
    <!-- Cadre géométrique -->
    <path d="M 0 20 L 20 0 L 160 0 L 180 20 L 180 180 L 160 200 L 20 200 L 0 180 Z" fill="#0D111A" stroke="#00E5FF" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Grille interne du cadre -->
    <line x1="0" y1="50" x2="180" y2="50" stroke="#00E5FF" stroke-width="0.5" opacity="0.15"/>
    <line x1="0" y1="100" x2="180" y2="100" stroke="#00E5FF" stroke-width="0.5" opacity="0.15"/>
    <line x1="0" y1="150" x2="180" y2="150" stroke="#00E5FF" stroke-width="0.5" opacity="0.15"/>
    <line x1="45" y1="0" x2="45" y2="200" stroke="#00E5FF" stroke-width="0.5" opacity="0.15"/>
    <line x1="90" y1="0" x2="90" y2="200" stroke="#00E5FF" stroke-width="0.5" opacity="0.15"/>
    <line x1="135" y1="0" x2="135" y2="200" stroke="#00E5FF" stroke-width="0.5" opacity="0.15"/>

    <!-- Lettre W stylisée -->
    <path d="M 30 60 L 60 140 L 90 80 L 120 140 L 150 60" fill="none" stroke="#F3F4F6" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
    
    <!-- Effet lumineux sur le W -->
    <path d="M 30 60 L 60 140 L 90 80 L 120 140 L 150 60" fill="none" stroke="#00E5FF" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" opacity="0.4" filter="url(#glowSubtle)"/>
    
    <!-- Nœuds de connexion -->
    <circle cx="30" cy="60" r="4" fill="#00E5FF" filter="url(#glowSubtle)"/>
    <circle cx="60" cy="140" r="4" fill="#00E5FF" filter="url(#glowSubtle)"/>
    <circle cx="90" cy="80" r="4" fill="#F3F4F6"/>
    <circle cx="120" cy="140" r="4" fill="#00E5FF" filter="url(#glowSubtle)"/>
    <circle cx="150" cy="60" r="4" fill="#00E5FF" filter="url(#glowSubtle)"/>

    <!-- Indicateur de statut -->
    <rect x="150" y="15" width="20" height="20" rx="4" fill="#00E5FF" opacity="0.2"/>
    <circle cx="160" cy="25" r="3" fill="#00E5FF" filter="url(#glowStrong)">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- ============================================================
       6. IDENTITÉ TYPOGRAPHIQUE (PARTIE CENTRALE)
       ============================================================ -->
  <g transform="translate(270, 0)">
    <!-- Nom principal -->
    <text x="0" y="100" font-family="'JetBrains Mono', 'Fira Code', ui-monospace, monospace" font-size="54" font-weight="800" fill="#F3F4F6" letter-spacing="6">SABRI WALID</text>
    
    <!-- Ligne d'accent sous le nom -->
    <rect x="0" y="120" width="350" height="2" fill="url(#accentGrad)"/>
    
    <!-- Titre de spécialité -->
    <text x="0" y="155" font-family="'Inter', -apple-system, sans-serif" font-size="16" font-weight="600" fill="#00E5FF" letter-spacing="4" filter="url(#glowSubtle)">NETWORKS / CLOUD / CYBERSECURITY</text>
    
    <!-- Détails de la formation -->
    <text x="0" y="185" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#9CA3AF">Bachelor in Networks, Cybersecurity &amp; Cloud</text>
    <text x="0" y="205" font-family="'Inter', -apple-system, sans-serif" font-size="12" fill="#9CA3AF">ESTK — Cadi Ayyad University</text>
    
    <!-- Badges techniques (style minimaliste) -->
    <g transform="translate(0, 225)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="90" height="22" rx="4" fill="#111827" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.5"/>
      <text x="45" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#F3F4F6" text-anchor="middle" letter-spacing="1">THREAT INTEL</text>
      
      <!-- Badge 2 -->
      <rect x="100" y="0" width="90" height="22" rx="4" fill="#111827" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.5"/>
      <text x="145" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#F3F4F6" text-anchor="middle" letter-spacing="1">AI / ML</text>
      
      <!-- Badge 3 -->
      <rect x="200" y="0" width="90" height="22" rx="4" fill="#111827" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.5"/>
      <text x="245" y="15" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#F3F4F6" text-anchor="middle" letter-spacing="1">NET ENGINEERING</text>
    </g>
  </g>

  <!-- ============================================================
       7. ILLUSTRATION TECHNIQUE (PARTIE DROITE)
       ============================================================ -->
  <g transform="translate(850, 40)">
    <!-- Cercle central (nœud principal) -->
    <circle cx="120" cy="100" r="40" fill="none" stroke="#00E5FF" stroke-width="1" opacity="0.3"/>
    <circle cx="120" cy="100" r="8" fill="#00E5FF" filter="url(#glowStrong)"/>
    
    <!-- Connexions orbitales -->
    <g stroke="#00E5FF" stroke-width="1" opacity="0.6">
      <!-- Lignes vers les nœuds -->
      <line x1="120" y1="100" x2="40" y2="50"/>
      <line x1="120" y1="100" x2="200" y2="40"/>
      <line x1="120" y1="100" x2="220" y2="140"/>
      <line x1="120" y1="100" x2="60" y2="170"/>
      <line x1="120" y1="100" x2="150" y2="190"/>
    </g>

    <!-- Nœuds secondaires (formes géométriques) -->
    <circle cx="40" cy="50" r="5" fill="#111827" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="40" cy="50" r="2" fill="#00E5FF"/>
    
    <rect x="195" y="35" width="10" height="10" fill="#111827" stroke="#00E5FF" stroke-width="1.5"/>
    <rect x="198" y="38" width="4" height="4" fill="#00E5FF"/>

    <polygon points="220,135 225,145 215,145" fill="#111827" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="220" cy="142" r="1.5" fill="#00E5FF"/>

    <circle cx="60" cy="170" r="5" fill="#111827" stroke="#00E5FF" stroke-width="1.5"/>
    <circle cx="60" cy="170" r="2" fill="#00E5FF"/>
    
    <rect x="145" y="185" width="10" height="10" fill="#111827" stroke="#00E5FF" stroke-width="1.5"/>
    <rect x="148" y="188" width="4" height="4" fill="#00E5FF"/>

    <!-- Lignes de connexion entre les nœuds secondaires (créant un maillage) -->
    <g stroke="#00E5FF" stroke-width="0.5" opacity="0.3">
      <line x1="40" y1="50" x2="200" y2="40"/>
      <line x1="200" y1="40" x2="220" y2="140"/>
      <line x1="220" y1="140" x2="150" y2="190"/>
      <line x1="150" y1="190" x2="60" y2="170"/>
      <line x1="60" y1="170" x2="40" y2="50"/>
    </g>

    <!-- Cercles de rayonnement (pulsation lente) -->
    <circle cx="120" cy="100" r="60" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.1">
      <animate attributeName="r" values="40;80;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    
    <circle cx="120" cy="100" r="80" fill="none" stroke="#00E5FF" stroke-width="0.5" opacity="0.1">
      <animate attributeName="r" values="60;100;60" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.1;0;0.1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <!-- Lignes de balayage (effet radar) -->
    <line x1="120" y1="100" x2="120" y2="20" stroke="#00E5FF" stroke-width="1" opacity="0.4">
      <animateTransform attributeName="transform" type="rotate" from="0 120 100" to="360 120 100" dur="8s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ============================================================
       8. DÉTAILS ET DÉCORATIONS
       ============================================================ -->
  <!-- Ligne verticale séparatrice subtile -->
  <line x1="820" y1="40" x2="820" y2="240" stroke="#00E5FF" stroke-width="1" opacity="0.1"/>
  
  <!-- Petits indicateurs de statut en bas à droite -->
  <g transform="translate(1100, 240)">
    <circle cx="0" cy="0" r="3" fill="#00E5FF" opacity="0.8"/>
    <circle cx="15" cy="0" r="3" fill="#00E5FF" opacity="0.4"/>
    <circle cx="30" cy="0" r="3" fill="#00E5FF" opacity="0.2"/>
  </g>

  <!-- Code binaire discret en bas à gauche -->
  <text x="40" y="255" font-family="ui-monospace, monospace" font-size="8" fill="#00E5FF" opacity="0.15" letter-spacing="2">01001110 01000101 01010100 01010111 01001111 01010010 01001011</text>

</svg>
